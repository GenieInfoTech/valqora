name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    name: Run Tests & Deploy to cPanel via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer, xml
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate App Key
        run: php artisan key:generate --ansi

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build
          rm -f public/hot

      - name: Run Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      - name: Remove Heavy Directories Before FTP Upload
        run: |
          rm -rf node_modules
          rm -rf vendor

      - name: Deploy Files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./valqora.genieimports.com/
          exclude: |
            .git/**
            .github/**
            tests/**
            node_modules/**
            vendor/**
            .env*
